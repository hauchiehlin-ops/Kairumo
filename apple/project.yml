name: Kairumo
options:
  bundleIdPrefix: com.kairumo
  deploymentTarget:
    iOS: "16.0"

targets:
  Kairumo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Examples/HomeWorkbenchUsage.swift
      - path: Generated/padnote_core.swift
      - path: Assets.xcassets
      # 說明文件（操作手冊、隱私權政策）以資料夾參照打包，
      # 子目錄結構要保留，HTML 裡的相對路徑（manual.js、img/）才找得到。
      - path: Resources/Docs
        type: folder
      # 文件範本目錄（工作項 S-61）。同樣用資料夾參照，載入時才找得到
      # `Templates/document-templates.json` 這個子路徑。
      - path: Resources/Templates
        type: folder
      # 權限說明的六個語系（產生自 i18n/ui-strings.json）。
      #
      # **這些 .lproj 要以 group 進 bundle，不能用 type: folder** ——
      # 資料夾參照會讓 `zh-Hant.lproj` 變成 bundle 裡的一個**子目錄**，
      # 而系統找的是 bundle 根目錄下的 `<語系>.lproj/InfoPlist.strings`。
      # 包錯位置的症狀是權限對話框仍然顯示 Info.plist 裡那一份，
      # 而且沒有任何警告。
      - path: Resources/Localizable
        includes:
          - "*.lproj/InfoPlist.strings"
        excludes: []
    dependencies:
      - framework: PadnoteCore.xcframework
        embed: false
    settings:
      base:
        ARCHS: arm64
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
        PRODUCT_NAME: Kairumo
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote
        DEVELOPMENT_TEAM: 6UJ8GS752W
        MARKETING_VERSION: "4.11.0"
        CURRENT_PROJECT_VERSION: "67"
        INFOPLIST_KEY_CFBundleShortVersionString: "4.11.0"
        INFOPLIST_KEY_CFBundleVersion: "67"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2,6" # 1: iPhone, 2: iPad, 6: Mac Catalyst
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: YES
        # **這一行不能少。** 產生器不會自己認得 `Info.plist`：少了它，
        # `xcodegen generate` 產出的 pbxproj 就沒有 `INFOPLIST_FILE`，
        # 於是 `apple/Info.plist` 裡那兩個「產生器表達不了的鍵」會**靜默消失** ——
        # OAuth 的 redirect scheme（回不到 App，畫面停在錯誤網址）與
        # Catalyst 的多視窗支援（「操作說明」按下去什麼也不會發生）。
        # 兩者都不會有任何編譯錯誤，只有在實際操作時才會發現。
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Kairumo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 權限說明的**基準值**（開發語系＝英文）。真正顯示給使用者的是
        # `Resources/Localizable/<語系>.lproj/InfoPlist.strings`，兩者都產生自
        # `i18n/ui-strings.json`。
        #
        # 這裡原本是寫死的繁體中文，而且 `Info.plist` 裡還有第二份一模一樣的。
        # 審查用英文語系的機器跑，看到的權限對話框是中文 —— 審查指南 4
        # （Design）判定「權限請求沒有跟著 App 的語系」，iOS 與 macOS 同時被退。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kairumo uses the microphone to record voice notes in class or meetings, keeping your handwriting in sync with the recording timeline."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Kairumo uses speech recognition to transcribe your recordings into text on your device and place the transcript in your notes."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kairumo uses the local network to edit notes together with people on the same Wi-Fi. Everything is end-to-end encrypted and never passes through a server."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kairumo accesses your photo library so you can place pictures into a note and annotate them."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Kairumo saves pages and drawings you export to your photo library."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Mac App Store 必填（上傳時被 altool 以 90242 擋下過）。
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        SWIFT_VERSION: "5.0"
        # 沙盒只掛在 macOS 上。iOS 一律沙盒化，帶這個鍵反而會讓佈建檔對不上。
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Kairumo-Mac.entitlements

  # 單元測試：轉換器這類純邏輯要能在毫秒內驗完，不該塞進 UI 測試裡跑。
  KairumoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kairumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote.tests
        DEVELOPMENT_TEAM: 6UJ8GS752W
        GENERATE_INFOPLIST_FILE: YES

  KairumoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # 畫面規格由核心產生（docs/conformance/screens.json），兩端共用同一份。
      # UI 測試 bundle 跑在 App 之外的行程，連不到核心框架，所以讀檔。
      - path: ../docs/conformance/screens.json
        buildPhase: resources
    dependencies:
      - target: Kairumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote.uitests
        DEVELOPMENT_TEAM: 6UJ8GS752W
        TEST_TARGET_NAME: Kairumo
        # 沒有這一行，測試 target 會因為「找不到 Info.plist」而無法簽章，
        # 整個 xcodebuild test 在建置階段就掛掉（不是測試失敗，是根本沒跑）。
        GENERATE_INFOPLIST_FILE: YES

# 明示定義 scheme：一旦寫了 schemes 區塊，xcodegen 就不再自動產生同名 scheme，
# 而 scripts/apple-release.sh 與日常建置都用 -scheme Kairumo。
schemes:
  Kairumo:
    build:
      targets:
        Kairumo: all
        KairumoTests: [test]
        KairumoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [KairumoTests, KairumoUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
