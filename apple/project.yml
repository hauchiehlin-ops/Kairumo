name: Kairumo
options:
  bundleIdPrefix: com.kairumo
  deploymentTarget:
    iOS: "16.0"

targets:
  Kairumo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Examples/HomeWorkbenchUsage.swift
      - path: Generated/padnote_core.swift
      - path: Assets.xcassets
      # 說明文件（操作手冊、隱私權政策）以資料夾參照打包，
      # 子目錄結構要保留，HTML 裡的相對路徑（manual.js、img/）才找得到。
      - path: Resources/Docs
        type: folder
      # 文件範本目錄（工作項 S-61）。同樣用資料夾參照，載入時才找得到
      # `Templates/document-templates.json` 這個子路徑。
      - path: Resources/Templates
        type: folder
    dependencies:
      - framework: PadnoteCore.xcframework
        embed: false
    settings:
      base:
        ARCHS: arm64
        PRODUCT_NAME: Kairumo
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote
        DEVELOPMENT_TEAM: 6UJ8GS752W
        MARKETING_VERSION: "3.9.0"
        CURRENT_PROJECT_VERSION: "33"
        INFOPLIST_KEY_CFBundleShortVersionString: "3.9.0"
        INFOPLIST_KEY_CFBundleVersion: "33"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2,6" # 1: iPhone, 2: iPad, 6: Mac Catalyst
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: YES
        # **這一行不能少。** 產生器不會自己認得 `Info.plist`：少了它，
        # `xcodegen generate` 產出的 pbxproj 就沒有 `INFOPLIST_FILE`，
        # 於是 `apple/Info.plist` 裡那兩個「產生器表達不了的鍵」會**靜默消失** ——
        # OAuth 的 redirect scheme（回不到 App，畫面停在錯誤網址）與
        # Catalyst 的多視窗支援（「操作說明」按下去什麼也不會發生）。
        # 兩者都不會有任何編譯錯誤，只有在實際操作時才會發現。
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Kairumo"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kairumo 需要麥克風權限以進行課堂與會議錄音，並與手寫筆記同步對齊。"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Mac App Store 必填（上傳時被 altool 以 90242 擋下過）。
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        SWIFT_VERSION: "5.0"
        # 沙盒只掛在 macOS 上。iOS 一律沙盒化，帶這個鍵反而會讓佈建檔對不上。
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Kairumo-Mac.entitlements

  # 單元測試：轉換器這類純邏輯要能在毫秒內驗完，不該塞進 UI 測試裡跑。
  KairumoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Kairumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote.tests
        DEVELOPMENT_TEAM: 6UJ8GS752W
        GENERATE_INFOPLIST_FILE: YES

  KairumoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kairumo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kairumo.padnote.uitests
        DEVELOPMENT_TEAM: 6UJ8GS752W
        TEST_TARGET_NAME: Kairumo
        # 沒有這一行，測試 target 會因為「找不到 Info.plist」而無法簽章，
        # 整個 xcodebuild test 在建置階段就掛掉（不是測試失敗，是根本沒跑）。
        GENERATE_INFOPLIST_FILE: YES

# 明示定義 scheme：一旦寫了 schemes 區塊，xcodegen 就不再自動產生同名 scheme，
# 而 scripts/apple-release.sh 與日常建置都用 -scheme Kairumo。
schemes:
  Kairumo:
    build:
      targets:
        Kairumo: all
        KairumoTests: [test]
        KairumoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [KairumoTests, KairumoUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
