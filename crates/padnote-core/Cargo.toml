[package]
name = "padnote-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true

[lib]
# cdylib 供 Swift/Kotlin 動態連結；staticlib 供 iOS 靜態連結。
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { workspace = true }
padnote-doc = { path = "../padnote-doc" }
padnote-ink = { path = "../padnote-ink" }
padnote-sync = { path = "../padnote-sync" }
padnote-asr = { path = "../padnote-asr" }
padnote-recognize = { path = "../padnote-recognize" }
padnote-storage = { path = "../padnote-storage" }
padnote-search = { path = "../padnote-search" }
padnote-export = { path = "../padnote-export" }
padnote-crypto = { path = "../padnote-crypto" }
padnote-models = { path = "../padnote-models" }
padnote-pdf = { path = "../padnote-pdf" }
padnote-recorder = { path = "../padnote-recorder" }
padnote-vad-silero = { path = "../padnote-vad-silero" }
padnote-text = { path = "../padnote-text" }
padnote-punct-ct = { path = "../padnote-punct-ct" }
padnote-embed = { path = "../padnote-embed" }
padnote-input = { path = "../padnote-input" }
