[package]
name = "padnote-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[lints]
workspace = true

[lib]
# cdylib 供 Swift/Kotlin 動態連結；staticlib 供 iOS 靜態連結。
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# 預設全開：Apple 版（iOS / iPadOS / macOS）的行為與相依完全不變。
default = ["asr", "pdf"]

# 語音相關（Silero VAD + 中文標點還原）。依賴 ONNX Runtime，
# 而 ort 目前沒有 aarch64-linux-android 的預編譯二進位 ——
# Android 第一版不含語音轉錄，就用 --no-default-features 關掉這一組。
asr = ["dep:padnote-vad-silero", "dep:padnote-punct-ct"]

# PDF 匯入／算繪。需要各 ABI 的 libpdfium 系統函式庫。
pdf = ["dep:padnote-pdf-pdfium"]

# 內建協同中繼（WebSocket）。**預設關閉**：
# Apple 版已經有自己的 Swift 實作（Network.framework）且運作穩定，
# 不需要也不應該把 tokio 拉進 iOS 的二進位。Android 建置時開啟即可，
# 兩邊仍然共用 padnote-relay 的同一份 JSON 協定。
relay = ["dep:padnote-relay", "dep:tokio"]

[dependencies]
uniffi = { workspace = true }
padnote-doc = { path = "../padnote-doc" }
padnote-ink = { path = "../padnote-ink" }
padnote-sync = { path = "../padnote-sync" }
padnote-asr = { path = "../padnote-asr" }
padnote-recognize = { path = "../padnote-recognize" }
padnote-storage = { path = "../padnote-storage" }
padnote-search = { path = "../padnote-search" }
padnote-export = { path = "../padnote-export" }
padnote-crypto = { path = "../padnote-crypto" }
padnote-models = { path = "../padnote-models" }
padnote-pdf = { path = "../padnote-pdf" }
padnote-pdf-pdfium = { path = "../padnote-pdf-pdfium", optional = true }
padnote-recorder = { path = "../padnote-recorder" }
padnote-vad-silero = { path = "../padnote-vad-silero", optional = true }
padnote-text = { path = "../padnote-text" }
padnote-punct-ct = { path = "../padnote-punct-ct", optional = true }
padnote-embed = { path = "../padnote-embed" }
padnote-input = { path = "../padnote-input" }
padnote-shapes = { path = "../padnote-shapes" }
padnote-i18n = { path = "../padnote-i18n" }
padnote-toolbar = { path = "../padnote-toolbar" }
padnote-relay = { path = "../padnote-relay", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"], optional = true }
# 備份容器：索引用 JSON、逐檔與整體校驗用 SHA-256
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
