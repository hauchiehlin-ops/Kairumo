[package]
name = "padnote-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 內部 crate，不發佈到 crates.io（workspace 內以 path 互相引用）。
publish = false

[lints]
workspace = true

[dependencies]
# 簡繁互查：把漢字統一折成簡體再建索引／查詢。與 `padnote-text` 同一個轉換表來源
# （OpenCC，Apache-2.0；zhconv 預設綁的 MediaWiki 表是 GPL，所以關掉 default-features）。
zhconv = { version = "0.4.2", default-features = false, features = ["opencc", "compress"] }
