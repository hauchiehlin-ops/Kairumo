[package]
name = "padnote-asr-whisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 內部 crate，不發佈到 crates.io（workspace 內以 path 互相引用）。
publish = false

[features]
# whisper.cpp 的 Metal 後端（Apple 的 GPU）。只有 Apple 建置會開。
metal = ["whisper-rs/metal"]

[dependencies]
padnote-asr = { path = "../padnote-asr" }
whisper-rs = { workspace = true }

[lints]
workspace = true
