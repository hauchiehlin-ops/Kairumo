name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # **沒有 Windows。** 這個 App 只出 iOS / iPadOS / macOS / Android，
        # 核心也不為 Windows 編。跑一個不出貨的平台，代價是每次提交多等
        # 四分鐘，而換到的資訊沒有人會拿來做決定。
        #
        # 留 ubuntu 的理由不同：Android 的核心就是在 Linux 上交叉編出來的。
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # cpal 在 Linux 走 ALSA、在 macOS 經 audiopus 需要 autotools 自行編 Opus。
      # 這兩個系統相依是 cpal 進 workspace 之後才出現的，CI 沒裝就整排紅。
      - name: 系統相依（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: 系統相依（macOS）
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      # ── Apple 的單元測試（一致性閘門 2）──────────────────────────
      #
      # 在此之前，CI 對 Apple 只做一件事：用 swiftc -parse 檢查兩個檔的語法。
      # 34 個測試檔、374 項測試從來沒有在 CI 執行過 —— 它們只有在某個人
      # 想起來在本機跑一次的時候才有意義。
      #
      # macOS runner 本來就已經在這個 job 裡跑了，所以多出來的成本只有
      # 建 xcframework 與跑測試（本機實測 17 秒）。
      #
      # **只跑單元測試，不跑 UITests。** 介面測試會因為動畫與載入時序
      # 間歇失敗，而間歇失敗的閘門會在第三次紅的時候被關掉 ——
      # 這個教訓 scripts/check-screen-parity.py 的說明裡已經寫過一次。
      # 把 runner 的 Xcode 版本印出來。
      #
      # 2026-09-22：Apple 端在 CI 上編不過，而本機編得過 —— 差別是本機
      # Xcode 27，runner 上舊得多，有些運算式只有新版的型別檢查器兜得起來。
      # 不印版本的話，下一次遇到同一類失敗只能靠猜。
      - name: Xcode 版本
        if: runner.os == 'macOS'
        run: xcodebuild -version
      - name: 核心的 xcframework（Apple 測試要連它）
        if: runner.os == 'macOS'
        run: ./scripts/build-xcframework.sh
      - name: Apple 單元測試
        if: runner.os == 'macOS'
        # 模擬器由腳本挑（見它的說明：寫死名字會在 Xcode 升版時無故變紅）。
        run: |
          xcodebuild test -project apple/Kairumo.xcodeproj -scheme Kairumo \
            -destination "id=$(python3 scripts/pick-ios-simulator.py)" \
            -only-testing:KairumoTests -quiet

      # 畫面稽核（提案 ①）：規格說必須有的控制項，要存在、而且**點得到**。
      #
      # 擋的是「畫得出來卻點不到」—— 控制項在、看得到、也是啟用的，但上面
      # 蓋了一層沒給 zIndex 的東西。同一個成因在這個專案發生過兩次
      # （討論串面板的收合鍵、圖釘放置層），兩次都是盯著截圖才發現的。
      # 掃原始碼的 check-screen-parity.py 看不見這種：那兩個 bug 的識別碼
      # 都寫得好好的。
      #
      # 只掛這幾條，不是整個 KairumoUITests —— testCanvasExpandsWhenSidebarCollapses
      # 與 testMigrationRunsFromTheDiagnosticsSheet 在此之前就紅著（S-259），
      # 把它們一起掛上去只會讓這道閘門在第一天就被關掉。
      #
      # 後幾條是 S-261／S-261d 補的：兩張選單裡的十九個項目與「自訂工具列」
      # 那張表，在此之前**完全沒有執行期檢查** —— 只有掃原始碼字面值的
      # check-screen-parity.py 在守，而它看不見「按鈕在但按不到」。
      #
      # InsertToolsAudit 逐一點開每個插入工具，確認它真的打開了東西。
      # 那六張面板裡原本有五張**一個識別碼都沒有**，所以任何自動檢查
      # 都碰不到它們 —— 使用者回報「不知道怎麼操作」時，我們連
      # 「它打不打得開」都答不出來。
      - name: 畫面稽核（控制項點得到）
        if: runner.os == 'macOS'
        run: |
          xcodebuild test -project apple/Kairumo.xcodeproj -scheme Kairumo \
            -destination "id=$(python3 scripts/pick-ios-simulator.py)" \
            -only-testing:KairumoUITests/SmokeUITests/testHomeScreenControlsAreReachable \
            -only-testing:KairumoUITests/SmokeUITests/testEditorScreenControlsAreReachable \
            -only-testing:KairumoUITests/SmokeUITests/testMoreMenuItemsAreReachable \
            -only-testing:KairumoUITests/SmokeUITests/testExportMenuItemsAreReachable \
            -only-testing:KairumoUITests/SmokeUITests/testToolbarCustomizationControlsAreReachable \
            -only-testing:KairumoUITests/InsertToolsAudit \
            -quiet

  # WP1/WP2：Android 產出必須跟著每次提交一起驗證，否則 Apple 端的改動會
  # 悄悄弄壞跨平台建置（例如把新的 ONNX 相依加進核心）。
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 不要讓它安裝預設的 `tools`。Google 已經把那個舊套件從 SDK 倉庫移除，
          # action 仍照裝，sdkmanager 找不到就以 exit 1 收場
          # （日誌只有一行 "Failed to find package 'tools'"，很容易被當成網路問題）。
          # NDK 與其他套件由下一步自己裝，這裡不需要它先裝任何東西。
          packages: ''
      - name: 系統相依（cpal → ALSA、audiopus → Opus）
        # libopus-dev 是必要的：下一步的 relay 測試是**在 host 上**編譯的，
        # 而 padnote-audio 會連 -lopus。android/prebuilt/opus 只有 Android 的
        # 版本，host 用不到它 —— 少了這個就是 `unable to find library -lopus`。
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: 安裝 NDK 與 cargo-ndk
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: 核心的中繼實作測試（relay feature）
        run: cargo test -p padnote-core --features relay --test relay_ffi
      - name: 核心能為 Android 編譯（第一版不含語音，關掉 asr/pdf，開啟 relay）
        run: ./scripts/build-android-libs.sh
      - name: 組 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      # WP8：上架檔也要每次驗。不簽章，因為 CI 不該碰到發佈金鑰 ——
      # 這裡要擋的是「AAB 根本組不起來」，那跟簽章無關。
      - name: 組上架用的 AAB（不簽章）
        run: ./scripts/android-release.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: kairumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairumo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  # Android 的正確性測試只有在真的 Android runtime 上才成立
  # （MotionEvent、密度換算、JNA 載入 .so 都不是純 JVM 模擬得了的），
  # 所以要一台模擬器。它比其他工作慢得多，因此獨立成一個 job。
  android-instrumented:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 不要讓它安裝預設的 `tools`。Google 已經把那個舊套件從 SDK 倉庫移除，
          # action 仍照裝，sdkmanager 找不到就以 exit 1 收場
          # （日誌只有一行 "Failed to find package 'tools'"，很容易被當成網路問題）。
          # NDK 與其他套件由下一步自己裝，這裡不需要它先裝任何東西。
          packages: ''
      - name: 系統相依（cpal → ALSA、audiopus → Opus）
        # libopus-dev 是必要的：下一步的 relay 測試是**在 host 上**編譯的，
        # 而 padnote-audio 會連 -lopus。android/prebuilt/opus 只有 Android 的
        # 版本，host 用不到它 —— 少了這個就是 `unable to find library -lopus`。
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: 安裝 NDK 與 cargo-ndk
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - run: ./scripts/build-android-libs.sh
      # KVM 是模擬器跑得動的前提；GitHub 的 ubuntu runner 需要手動放行。
      - name: 開啟 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 跑 instrumented 測試
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # 手寫辨識要 Google Play 服務，google_apis 映像才有。
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  # 決策 D6：授權稽核。禁止 AGPL 進入相依樹。
  # 每一筆豁免的理由都寫在 deny.toml 裡，不要在這裡放行。
  # ── 一致性閘門 3：多裝置模型檢查 ────────────────────────────────
  #
  # 隨機抽幾百步「一台裝置能做的事」（編輯／同步／壓實／里程碑／還原／
  # 離線／裝置消失／新裝置加入），每一步之後檢查收斂、單調、冪等、
  # 快照回得去。失敗時自動把序列縮到最短再印出來。
  #
  # 這道閘門在寫出來的第一天就抓到兩個會掉資料的 bug —— 兩個都是
  # 「我沒想到要去試」的情境。它跑在一般的 Linux runner 上，幾十秒。
  model-check:
    name: Multi-device model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 系統相依（cpal → ALSA、audiopus → Opus）
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: 隨機歷史與回歸種子
        run: cargo test -p padnote-core --no-default-features --test model_multi_device
      # 一致性閘門 1：向量必須與核心目前的行為一致。
      # 兩端各有一支測試讀同一份向量（Apple 在 Test (macOS)，
      # Android 在 android-instrumented），所以向量一動，兩邊都會跟著動。
      - name: 一致性向量與核心一致
        run: cargo test -p padnote-core --no-default-features --test conformance_vectors

  licenses:
    name: License audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # J7：資料遺失零容忍。格式層的截斷與版本相容測試在此擋關。
  format-compat:
    name: Format compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 系統相依（cpal → ALSA、audiopus → Opus）
        # libopus-dev 是必要的：下一步的 relay 測試是**在 host 上**編譯的，
        # 而 padnote-audio 會連 -lopus。android/prebuilt/opus 只有 Android 的
        # 版本，host 用不到它 —— 少了這個就是 `unable to find library -lopus`。
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: 編解碼往返、截斷偵測、版本拒絕
        run: cargo test -p padnote-ink -p padnote-core -- --nocapture
      # S-61：文件範本目錄是**產物**。有人改了 templates/src 卻沒重跑 build，
      # 或直接改了產物，兩個 App 打包進去的就是對不上來源的那一份 ——
      # 而那不會有任何錯誤訊息，只是範本內容不對。
      - name: 文件範本目錄與來源一致
        run: python3 scripts/doc_templates_tool.py verify
      # 手冊與隱私權政策同樣是**產物**：只維護 manual.js 與 privacy.html，
      # 各平台的版本由腳本產生。有人改了來源卻沒重跑，或直接改了產物，
      # 使用者讀到的說明就是錯的 —— 而那不會有任何錯誤訊息。
      #
      # 產生器順帶擋「平台用語洩漏」：Android 的手冊裡出現 iPad、
      # 或 Apple 的手冊裡出現 Android，都會紅。那件事 2026-09-22 真的發生過
      # （Android 手冊叫使用者去看「桌機版視窗左上角」）。
      - name: 操作手冊各平台版與來源一致
        run: python3 scripts/build-platform-docs.py --check
      - name: 隱私權政策各平台版與來源一致
        run: python3 scripts/build-privacy-docs.py --check
      # 字串表與它的驗證早就存在，問題從來不是「沒有機制」，
      # 是沒有東西阻止你繞過它 —— 直接寫 Text("診斷") 一樣編得過、
      # 一樣跑得動，只是別的語言看不懂。2026-09-22 盤點時 Apple 端有 59 處。
      - name: 介面上沒有硬寫死的文字
        run: python3 scripts/check-hardcoded-strings.py

      # 主執行緒上的 lstat。
      #
      # v4.8.2 build 60 在 iPhone 17 上按下雲端同步就被 SIGKILL：
      # scene-update 看門狗 10 秒到期（0x8BADF00D），主執行緒堆疊頂端停在
      # lstat ← _SwiftURL.isDirectory ← URL.appendingPathComponent。
      # 那個多載的 directoryHint 預設是 .checkFileSystem，當時 Sources 裡
      # 有 100 處在用它。Android 沒事：File(parent, child) 是純字串運算。
      - name: 主執行緒上沒有會 lstat 的路徑組法
        run: python3 scripts/check-main-thread-io.py

      # MainActor.assumeIsolated。
      #
      # 它的意思是「我保證這裡是主執行緒」，編譯器照單全收 —— 保證錯了
      # 沒有警告，只有執行期的 SIGTRAP。把同步的匯出搬離 MainActor 時
      # 一連踩到三顆（PageGeometry.width、height(forPage:) 的預設參數、
      # PageGuideRenderer 的字串查表），每一顆都是行程直接消失。
      - name: 沒有 MainActor.assumeIsolated
        run: python3 scripts/check-assume-isolated.py

      # 被默默忽略的參數。
      #
      # 一個宣告了但主體從沒讀過的參數**看起來像是有作用的** —— 呼叫端照著
      # 傳，以為設定生效了。編譯器不會警告，測試也測不到（那個功能本來就
      # 沒接上，沒有人會為它寫測試）。第一次跑抓到 10 處，其中
      # createRoom(noteId:) 建立協同房間時完全不管是哪一本筆記、
      # generate(maxTokens:) 的 token 上限從不生效、
      # editorModeSwitcher(compact:) 的緊湊版面旗標沒接線。
      - name: 沒有被默默忽略的參數
        run: python3 scripts/check-unused-params.py

      # 實作好了但沒有任何人引用的型別與函式。
      #
      # 功能寫完了、程式碼在那裡、看起來一切正常，但沒有任何路徑會走到它 ——
      # 使用者在介面上看不到，或看得到卻按不出反應。Swift 與 Kotlin 都不對
      # public 宣告報 dead code，測試也測不到（沒有人會為接不上的功能寫測試）。
      # 第一次跑抓到 23 處，其中套索的 cut/duplicate/move/recolor 四個操作
      # 與它的外框 View 全部沒接線 —— 那是一整個功能是死的。
      - name: 沒有沒人引用的實作
        run: python3 scripts/check-orphans.py

  # 跨平台畫面對照（android-parity-plan.md 階段 0）。
  #
  # 「Android 版面跟 Apple 差太多」修過兩次，兩次都是補完就漂回去 ——
  # 因為沒有東西守著它。這道閘門守的就是那件事：核心 `ffi_screens` 裡的
  # 控制項，兩端程式碼都要找得到對應的識別字。
  #
  # 已知缺口寫在 docs/parity/baseline.json（棘輪，只縮不長），
  # 所以這個 job 今天是綠的，但**新增**的缺口一定會紅。
  screen-parity:
    name: Screen parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 系統相依（cpal → ALSA、audiopus → Opus）
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config
      - name: 畫面規格自身的測試
        run: cargo test -p padnote-core --lib ffi_screens
      - name: 兩端控制項對照
        run: python3 scripts/check-screen-parity.py

  # S-12：FFI 綁定必須產得出來。core 的 API 改壞時在這裡就會爆，
  # 而不是等到 Xcode 編不過。
  bindings:
    name: FFI bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 系統相依（audiopus 自行編 Opus 需要 autotools）
        run: brew install autoconf automake libtool
      - name: 產生 Swift / Kotlin 綁定
        run: ./scripts/generate-bindings.sh
      - name: Swift 語法檢查
        run: |
          xcrun --sdk iphoneos swiftc -parse -target arm64-apple-ios17.0 \
            apple/Generated/padnote_core.swift apple/Examples/SessionUsage.swift

  # --- 以下為 M0 完成後啟用的效能與品質閘門（docs/roadmap.md）---
  #
  # ink-latency:   J1 墨跡 motion-to-photon ≤ 9ms，不得回退
  # asr-cer:       M0/S2 中文 CER 安靜 ≤8% / 嘈雜 ≤18%，不得惡化
  # crash-safety:  J7 隨機殺行程 + 斷電模擬，驗證零資料遺失
  #
  # 目前 blocked on：實體 iPad 測試機、padnote-bench 中文測試集

# 本機要與 CI 對齊的話跑這一行（`-D warnings` 是上面 env 設的，
# 少了它本機看到的是警告、CI 看到的是錯誤）：
#
#   RUSTFLAGS="-D warnings" cargo clippy --workspace --all-targets
