name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # WP1/WP2：Android 產出必須跟著每次提交一起驗證，否則 Apple 端的改動會
  # 悄悄弄壞跨平台建置（例如把新的 ONNX 相依加進核心）。
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安裝 NDK 與 cargo-ndk
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: 核心能為 Android 編譯（第一版不含語音，關掉 asr/pdf）
        run: ./scripts/build-android-libs.sh
      - name: 組 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kairumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 決策 D6：授權稽核。禁止 AGPL 進入相依樹。
  licenses:
    name: License audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  # J7：資料遺失零容忍。格式層的截斷與版本相容測試在此擋關。
  format-compat:
    name: Format compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 編解碼往返、截斷偵測、版本拒絕
        run: cargo test -p padnote-ink -p padnote-core -- --nocapture

  # S-12：FFI 綁定必須產得出來。core 的 API 改壞時在這裡就會爆，
  # 而不是等到 Xcode 編不過。
  bindings:
    name: FFI bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 產生 Swift / Kotlin 綁定
        run: ./scripts/generate-bindings.sh
      - name: Swift 語法檢查
        run: |
          xcrun --sdk iphoneos swiftc -parse -target arm64-apple-ios17.0 \
            apple/Generated/padnote_core.swift apple/Examples/SessionUsage.swift

  # --- 以下為 M0 完成後啟用的效能與品質閘門（docs/roadmap.md）---
  #
  # ink-latency:   J1 墨跡 motion-to-photon ≤ 9ms，不得回退
  # asr-cer:       M0/S2 中文 CER 安靜 ≤8% / 嘈雜 ≤18%，不得惡化
  # crash-safety:  J7 隨機殺行程 + 斷電模擬，驗證零資料遺失
  #
  # 目前 blocked on：實體 iPad 測試機、padnote-bench 中文測試集
