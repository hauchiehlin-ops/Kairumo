[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/padnote/padnote"

# 相依套件集中管理。每個新增項都必須通過 deny.toml 的授權白名單。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"
uniffi = { version = "0.29", features = ["cli"] }
# 原生相依。libopus 為 BSD-3，見 models/MODELS.md。
audiopus = "0.2"
# whisper.cpp 綁定。程式碼與 Whisper 模型權重皆為 MIT（見 models/MODELS.md）。
whisper-rs = "0.16"
# PDFium 為 BSD-3。❌ 絕不使用 MuPDF（AGPL），見 deny.toml。
# thread_safe：PDFium 的 C API 不是執行緒安全的，這個 feature 會在呼叫周圍
# 加互斥鎖。沒有它就無法滿足 PdfDocument 的 Send + Sync 約束。
pdfium-render = { version = "0.8", features = ["thread_safe"] }
# ONNX Runtime。同一個執行期同時服務 Silero VAD、Paraformer-zh（S-24）
# 與 PP-OCRv5（D4），比每個模型各帶一套推論庫划算。
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
rustfft = "6"
png = "0.18"
miniz_oxide = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
