<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairumo Pro — VIP 禮遇通行證兌換</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(22, 27, 38, 0.85);
      --gold-start: #f59e0b;
      --gold-end: #d97706;
      --text: #f3f4f6;
      --text-sec: #9ca3af;
      --border: rgba(245, 158, 11, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.12), transparent 60%);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .crown {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4));
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p.desc {
      color: var(--text-sec);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-start), var(--gold-end));
      color: #111;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
    }
    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .status-toast {
      font-size: 13px;
      color: #34d399;
      margin-top: 10px;
      min-height: 18px;
      font-weight: 500;
    }
    .code-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #d1d5db;
      word-break: break-all;
      margin-bottom: 16px;
      text-align: left;
      max-height: 60px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="crown">👑</div>
    <h1>Kairumo VIP 禮遇通行證</h1>
    <p class="desc">您收到了一份 Kairumo Pro 尊榮禮遇授權！點擊下方按鈕即可在裝置上立即啟動解鎖。</p>

    <div id="codePreview" class="code-box" style="display: none;"></div>

    <a id="openAppBtn" class="btn btn-gold" href="#">在 Kairumo 中開啟並解鎖</a>
    <button id="copyBtn" class="btn btn-outline" type="button">📋 複製禮遇代碼</button>

    <div id="statusToast" class="status-toast"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const giftToken = urlParams.get('gift') || '';
    const openBtn = document.getElementById('openAppBtn');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('statusToast');
    const codePreview = document.getElementById('codePreview');

    if (giftToken) {
      const deepLink = 'kairumo://vip?gift=' + encodeURIComponent(giftToken);
      openBtn.href = deepLink;
      codePreview.style.display = 'block';
      codePreview.textContent = deepLink;

      // 自動嘗試喚醒 App
      window.location.href = deepLink;

      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(deepLink).then(() => {
          toast.textContent = '✅ 已複製！開啟 Kairumo App 即可自動解鎖';
        }).catch(() => {
          toast.textContent = '請手動長按上方代碼進行複製';
        });
      });
    } else {
      openBtn.style.display = 'none';
      copyBtn.style.display = 'none';
      toast.style.color = '#f87171';
      toast.textContent = '⚠️ 連結缺少有效的禮遇通行證參數';
    }
  </script>
</body>
</html>
