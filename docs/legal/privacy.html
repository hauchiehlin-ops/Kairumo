<style>

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1217;
      --surface: #161B22;
      --ink: #E6EBF2;
      --ink-soft: #98A4B4;
      --rule: #242C37;
      --accent: #7FA9FF;
      --accent-soft: #16233A;

  }

    --paper: #0E1217;
    --surface: #161B22;
    --ink: #E6EBF2;

    --accent: #7FA9FF;
    --accent-soft: #16233A;
    --mark: #4CC38A;
    --mark-soft: #12261E;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 74ch; margin: 0 auto; padding: 0 24px 96px; }

  header.masthead {
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    padding: 40px 0 28px;
    margin-bottom: 40px;
  }
  header.masthead .wrap { padding-bottom: 0; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede { color: var(--ink-soft); margin: 0 0 22px; max-width: 60ch; }
  .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin: 0 0 20px;
  }

  .langbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .langbar button {
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .langbar button:hover { border-color: var(--accent); color: var(--accent); }
  .langbar button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .langbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .summary {
    background: var(--mark-soft);
    border-left: 3px solid var(--mark);
    padding: 18px 20px;
    border-radius: 0 8px 8px 0;
    margin: 0 0 40px;
  }
  .summary p { margin: 0; }

  section { margin: 0 0 38px; scroll-margin-top: 24px; }
  h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 4px;
    display: flex;
    gap: 12px;
    align-items: baseline;
    text-wrap: balance;
  }
  h2 .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    flex: none;
  }
  section > p { margin: 10px 0; }
  ul { margin: 10px 0; padding-left: 20px; }
  li { margin: 6px 0; }
  li::marker { color: var(--accent); }
  strong { font-weight: 600; }
  code, .addr {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 4px;
  }
  footer {
    border-top: 1px solid var(--rule);
    margin-top: 48px;
    padding-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  footer a { color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>

  });

  document.querySelectorAll("#langbar button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.code === code));
  });
  try { localStorage.setItem(STORE_KEY, code); } catch (e) { /* 私密視窗會擋，忽略即可 */ }
}

const bar = document.getElementById("langbar");
ORDER.forEach(code => {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.code = code;
  b.textContent = DOC[code].name;
  b.addEventListener("click", () => render(code));
  bar.appendChild(b);
});

let initial = "zh-Hant";
try {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved && DOC[saved]) initial = saved;
  else {
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("en")) initial = "en";
    else if (nav.startsWith("ja")) initial = "ja";
    else if (nav.startsWith("ko")) initial = "ko";
    else if (nav.startsWith("th")) initial = "th";
    else if (nav.includes("hans") || nav === "zh-cn") initial = "zh-Hans";
  }
} catch (e) { /* ignore */ }
render(initial);
</script>
