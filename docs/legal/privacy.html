<style>
  :root {

    --accent: #1F4FD8;
    --accent-soft: #E9EEFC;

    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E1217;
      --surface: #161B22;
      --ink: #E6EBF2;
      --ink-soft: #98A4B4;
      --ink-faint: #6B7789;
      --rule: #242C37;
      --accent: #7FA9FF;
      --accent-soft: #16233A;
      --mark: #4CC38A;
      --mark-soft: #12261E;
    }

  :root[data-theme="dark"] {
    --paper: #0E1217;
    --surface: #161B22;
    --ink: #E6EBF2;
    --ink-soft: #98A4B4;
    --ink-faint: #6B7789;
    --rule: #242C37;
    --accent: #7FA9FF;
    --accent-soft: #16233A;
    --mark: #4CC38A;
    --mark-soft: #12261E;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 74ch; margin: 0 auto; padding: 0 24px 96px; }

  header.masthead {
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    padding: 40px 0 28px;
    margin-bottom: 40px;
  }
  header.masthead .wrap { padding-bottom: 0; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(30px, 5vw, 42px);
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  .lede { color: var(--ink-soft); margin: 0 0 22px; max-width: 60ch; }
  .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin: 0 0 20px;
  }

  .langbar { display: flex; align-items: center; gap: 8px; }
  .langbar label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .langbar select {
    font: inherit;
    font-size: 14px;
    padding: 7px 34px 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background-color: var(--surface);
    color: var(--ink);
    cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .langbar select:hover { border-color: var(--accent); }
  .langbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .summary {
    background: var(--mark-soft);
    border-left: 3px solid var(--mark);
    padding: 18px 20px;
    border-radius: 0 8px 8px 0;
    margin: 0 0 40px;
  }
  .summary p { margin: 0; }

  section { margin: 0 0 38px; scroll-margin-top: 24px; }
  h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    line-height: 1.3;
    margin: 0 0 4px;
    display: flex;
    gap: 12px;
    align-items: baseline;
    text-wrap: balance;
  }
  h2 .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    flex: none;
  }
  section > p { margin: 10px 0; }
  ul { margin: 10px 0; padding-left: 20px; }
  li { margin: 6px 0; }
  li::marker { color: var(--accent); }
  strong { font-weight: 600; }
  code, .addr {
    font-family: var(--mono);
    font-size: 0.9em;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 4px;
  }
  footer {
    border-top: 1px solid var(--rule);
    margin-top: 48px;
    padding-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  footer a { color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow">Kairumo</p>
    <h1 id="title"></h1>
    <p class="lede" id="tagline"></p>
    <p class="meta"><span id="effective"></span><span id="appver"></span></p>
    <div class="langbar" id="langbar" role="group" aria-label="Language"></div>
  </div>
</header>

<main class="wrap">
  <div class="summary"><p id="summary"></p></div>
  <div id="body"></div>
  <footer id="footer"></footer>
</main>

      ["Google 드라이브 동기화(선택)", "본인의 Google 계정으로 자동 동기화를 선택할 수 있습니다. **선택 기능입니다** —— 로그인하지 않아도 앱의 모든 기능이 그대로 동작합니다.", ["로그인은 Google의 공식 동의 화면을 거칩니다. 받는 권한은 <strong>앱 전용 폴더</strong>에만 닿으며, 드라이브의 다른 파일은 볼 수 없습니다.", "동기화 데이터는 Google 드라이브의 <code>appDataFolder</code>에 저장됩니다. 파일 목록에 나타나지 않고 다른 앱도 읽을 수 없는 숨김 영역입니다.", "인증 토큰은 이 기기에만 있습니다. 저희에게는 서버가 없으므로 토큰이 저희를 거치는 일은 없습니다.", "그 사본은 Google의 약관과 개인정보 처리방침을 따릅니다. 귀하와 Google 사이의 관계입니다.", "홈 화면의 “클라우드 동기화”에서 언제든 로그아웃할 수 있습니다. 권한을 완전히 취소하려면 Google 계정 보안 설정에서 이 앱을 제거하세요."]],
      ["협업 방식", "협업은 당사의 서버를 거치지 않습니다. 애초에 서버를 운영하지 않습니다.", ["세션을 시작한 기기가 직접 중계 역할을 하고, 참여자는 그 기기에 바로 연결합니다.", "모든 내용은 AES-256-GCM으로 종단 간 암호화됩니다. 키는 초대 링크의 프래그먼트에 담기므로 중계기는 읽을 수 없는 암호문만 전달합니다.", "기술적 결과로, 같은 세션의 참여자들은 서로의 로컬 네트워크 IP 주소를 알게 됩니다. 직접 연결의 본질적 특성입니다.", "오프라인 중의 편집은 기기에 대기했다가 연결이 복구되면 자동으로 전송됩니다."]],
      ["손글씨 인식과 음성 전사", "둘 다 기기 안에서 처리됩니다.", ["손글씨 인식은 운영체제에 내장된 온디바이스 기능을 사용합니다.", "음성 전사는 기기에 내려받은 모델로 실행되며 오디오는 기기를 떠나지 않습니다.", "클라우드 인식이나 클라우드 전사 서비스는 사용하지 않습니다.", "음성-필기 동기화로 생성된 타임스탬프는 로컬 노트 파일에만 저장되며 생체 정보를 포함하지 않고 외부로 전송되지 않습니다."]],
      ["모델 다운로드", "음성·인식 모델을 내려받을 때:", ["파일은 Hugging Face나 GitHub Releases 같은 공개 출처에서 받습니다.", "일반적인 다운로드와 마찬가지로 해당 호스트는 사용자의 IP 주소를 보게 되며, 각자의 개인정보 방침이 적용됩니다.", "당사는 그 다운로드에 관한 어떤 정보도 받지 않습니다."]],

      ["아동 개인정보", "본 앱은 연령과 무관하게 개인정보를 수집하지 않으므로, 만 13세(또는 현지 법령이 정한 연령) 미만 아동의 정보도 수집하지 않습니다."],
      ["권리와 데이터 삭제", "당사가 사본을 보유하지 않으므로 삭제는 전적으로 사용자에게 달려 있습니다:", ["앱에서 노트를 삭제하면 기기에서 제거됩니다.", "앱을 삭제하면 샌드박스 안의 모든 데이터가 함께 사라집니다.", "폴더를 본인의 클라우드에 두었다면 그곳에서도 삭제하세요.", "당사가 대신 삭제하거나 복구할 수는 없습니다. 보유한 적이 없기 때문입니다.", "<strong>알아 두실 점</strong>: 노트 파일은 설계상 <strong>추가 전용</strong>입니다(여러 기기 병합에서 데이터를 잃지 않기 위한 전제입니다). 마일스톤 스냅샷은 의도적으로 기록을 보존합니다. 따라서 앱에서 삭제한 글자나 필기는 화면에서는 사라지지만, 자동으로 압축되기 전까지 파일 내부에 남아 있을 수 있습니다. <strong>.padnote 파일을 공유하기 전에 이 점을 기억하세요</strong> — 받은 사람이 Kairumo로 열면 삭제 이전의 마일스톤으로 되돌릴 수 있습니다. 기록 없이 전달하려면 PDF나 이미지로 내보내세요."]],

    sections: [
      ["ข้อมูลที่เราไม่เก็บ", "Kairumo ไม่เก็บ ไม่ส่ง และไม่บันทึกสิ่งต่อไปนี้:", ["ชื่อ อีเมล เบอร์โทร หรือข้อมูลบัญชีใด ๆ —— แอปไม่มีการสมัครและไม่มีการเข้าสู่ระบบ", "เนื้อหาโน้ต เส้นลายมือ ไฟล์เสียง และข้อความที่ถอดจากเสียง", "ตำแหน่งที่ตั้ง รายชื่อผู้ติดต่อ ปฏิทิน หรือรหัสโฆษณา", "สถิติการใช้งาน รายงานข้อขัดข้อง หรือข้อมูลวัดผล —— ในแอปไม่มี SDK วิเคราะห์หรือโฆษณาใด ๆ"]],

      ["ไม่มีการติดตามจากบุคคลที่สาม", "แอปไม่มี SDK โฆษณา ไม่มี SDK วิเคราะห์ ไม่มีการทดสอบ A/B และไม่มีการติดตามการแจ้งเตือน ซอร์สโค้ดเปิดเผย ทุกคนตรวจสอบได้"],
      ["การทำงานร่วมกันขั้นสูงและการถ่ายโอน P2P", "เวอร์ชันล่าสุดได้เปิดตัวฟีเจอร์การทำงานร่วมกันขั้นสูง (Live Cursors, Voice Rooms, Time Machine) โดยยึดหลัก Local-first:", ["**Live Cursors & Voice Rooms**: ข้อมูลเป็นแบบชั่วคราว ส่งตรงผ่าน WebRTC / mDNS และจะหายไปเมื่อปิดการเชื่อมต่อ ไม่มีการจัดเก็บข้อมูล", "**Time Machine**: ประวัติการแก้ไขจะถูกเก็บไว้ในไฟล์ Oplog ในเครื่องเท่านั้น", "**การแนะนำ Tailscale**: สำหรับการซิงค์ข้ามเครือข่าย ขอแนะนำให้ใช้ Tailscale เพื่อการทะลุผ่าน NAT ที่ปลอดภัยและรักษาความเป็นส่วนตัวแบบ P2P"]],
      ["ความเป็นส่วนตัวของเด็ก", "แอปนี้ไม่เก็บข้อมูลส่วนบุคคลจากผู้ใช้ทุกช่วงอายุ จึงไม่เก็บข้อมูลของเด็กอายุต่ำกว่า 13 ปี (หรือตามอายุที่กฎหมายท้องถิ่นกำหนด) ด้วย"],
      ["สิทธิของคุณและการลบข้อมูล", "เนื่องจากเราไม่มีสำเนาข้อมูลของคุณ การลบจึงอยู่ในมือคุณทั้งหมด:", ["ลบโน้ตในแอป ข้อมูลจะถูกลบออกจากเครื่อง", "ลบแอป ข้อมูลทั้งหมดในพื้นที่ของแอปจะถูกลบไปด้วย", "หากคุณเก็บโฟลเดอร์ไว้ในคลาวด์ของคุณเอง โปรดลบที่นั่นด้วย", "เราไม่สามารถลบหรือกู้คืนข้อมูลแทนคุณได้ เพราะเราไม่เคยมีข้อมูลนั้น", "<strong>สิ่งที่ควรทราบ</strong>: ไฟล์สมุดออกแบบให้<strong>เพิ่มต่อท้ายเท่านั้น</strong> (เป็นเงื่อนไขที่ทำให้การรวมข้อมูลหลายอุปกรณ์ไม่สูญหาย) และสแนปช็อตเหตุการณ์สำคัญจงใจเก็บประวัติไว้ ดังนั้นข้อความหรือลายมือที่คุณลบในแอปจะหายไปจากหน้าจอ แต่ยังอาจอยู่ภายในไฟล์จนกว่าระบบจะบีบอัดอัตโนมัติ <strong>โปรดจำข้อนี้ก่อนแบ่งปันไฟล์ .padnote</strong> — ผู้ที่เปิดด้วย Kairumo สามารถย้อนกลับไปยังเหตุการณ์สำคัญก่อนที่คุณจะลบได้ หากต้องการส่งต่อโดยไม่มีประวัติ ให้ส่งออกเป็น PDF หรือรูปภาพแทน"]],

    ],
    footer: "Kairumo · ฟรี · โอเพนซอร์ส · เก็บข้อมูลในเครื่องเป็นหลัก"
  }
};

const ORDER = ["zh-Hant", "en", "zh-Hans", "ja", "ko", "th"];
const STORE_KEY = "kairumo.privacy.lang";

function pad(n) { return String(n).padStart(2, "0"); }

  const bold = (t) => String(t == null ? "" : t)
    .split("**")
    .map((part, i) => (i % 2 === 1 ? "<strong>" + part + "</strong>" : part))
    .join("");

function render(code) {
  const d = DOC[code];
  document.documentElement.lang = code;
  document.getElementById("title").textContent = d.title;
  document.getElementById("tagline").textContent = d.tagline;
  document.getElementById("effective").textContent = d.effective;
  document.getElementById("appver").textContent = d.appver;
  document.getElementById("summary").textContent = d.summary;
  document.getElementById("footer").textContent = d.footer;

  const body = document.getElementById("body");
  body.innerHTML = "";
  d.sections.forEach((sec, i) => {
    const [heading, intro, bullets] = sec;
    const el = document.createElement("section");
    const h = document.createElement("h2");
    h.innerHTML = '<span class="num">' + pad(i + 1) + "</span><span>" + heading + "</span>";
    el.appendChild(h);
    const p = document.createElement("p");
    // `**重點**` → <strong>。這一頁本來就用 innerHTML（條文裡有內嵌的
    // <strong> 與 <code>），所以直接換標記即可，內容全部來自這個檔案。
    p.innerHTML = bold(intro.replace("CONTACT_EMAIL", CONTACT));
    el.appendChild(p);
    if (bullets) {
      const ul = document.createElement("ul");
      bullets.forEach(b => {
        const li = document.createElement("li");
        li.innerHTML = bold(b);
        ul.appendChild(li);
      });
      el.appendChild(ul);
    }
    body.appendChild(el);
  });

  const sel = document.getElementById("langselect");
  if (sel) sel.value = code;
  try { localStorage.setItem(STORE_KEY, code); } catch (e) { /* 私密視窗會擋，忽略即可 */ }
}

const bar = document.getElementById("langbar");
const label = document.createElement("label");
label.setAttribute("for", "langselect");
label.textContent = "Language";
const select = document.createElement("select");
select.id = "langselect";
ORDER.forEach(code => {
  const o = document.createElement("option");
  o.value = code;
  o.textContent = DOC[code].name;
  select.appendChild(o);
});
select.addEventListener("change", () => render(select.value));
bar.appendChild(label);
bar.appendChild(select);

let initial = "zh-Hant";
try {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved && DOC[saved]) initial = saved;
  else {
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("en")) initial = "en";
    else if (nav.startsWith("ja")) initial = "ja";
    else if (nav.startsWith("ko")) initial = "ko";
    else if (nav.startsWith("th")) initial = "th";
    else if (nav.includes("hans") || nav === "zh-cn") initial = "zh-Hans";
  }
} catch (e) { /* ignore */ }
render(initial);
</script>
