# 授權稽核（決策 D6）。CI 強制執行。
#
# 最重要的規則：**禁止 AGPL**。MuPDF 是 AGPL，會污染整個 App —— PDF 一律用
# PDFium (BSD-3)。

[licenses]
version = 2
# 允許清單採白名單制：未列出的授權一律擋下，強迫人工審查。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MITNFA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",      # UniFFI；file-level copyleft，不污染整體
    "Unlicense",    # SQLite
    # webpki-root-certs：只是一份 CA 根憑證資料，不是程式碼。
    # CDLA-Permissive-2.0 是資料用的寬鬆授權，無 copyleft 義務。
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# zhconv 在 crates.io 上宣告為 GPL-2.0-or-later，但那是最保守的統括宣告。
# 上游 README 寫得很清楚：
#
#   "The library itself is licensed under MIT OR Apache-2.0 ... BUT it may
#    bundle: Conversion tables from MediaWiki (the default, gated by the
#    feature `mediawiki`) which are licensed under GPL-2.0-or-later;
#    Dictionaries from OpenCC (gated by the feature `opencc`) licensed under
#    Apache-2.0. For MIT compatibility, disable the default `mediawiki`
#    feature and enable `opencc`."
#
# crates/padnote-text/Cargo.toml 正是這樣設定的（default-features = false，
# features = ["opencc", "compress"]），可用以下指令複驗實際啟用的 feature：
#
#   cargo tree -p padnote-text -e features --depth 1
#
# 目前輸出只有 "compress" 與 "opencc" —— GPL 的 MediaWiki 轉換表沒有被打包。
# cargo-deny 只讀 crates.io 的 license 欄位，看不到 feature 層級的差異，
# 所以在這裡澄清它在本專案的實際授權。
#
# ⚠️ 若哪天 padnote-text 打開了 mediawiki feature，這份澄清就不成立，
#    整個 App 會落入 GPL。改那個 feature 之前必須回來重新評估。
# 這裡放行的是「crates.io 上那個保守的統括宣告」，不是接受 GPL 進入本專案。
# 依上述設定，實際打包進來的只有 OpenCC 的 Apache-2.0 詞典。
[[licenses.exceptions]]
name = "zhconv"
allow = ["GPL-2.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace 內部的 path 相依（padnote-* 互相引用）沒有版本需求，會被
# wildcards = "deny" 判成萬用字元。這些 crate 不發佈到 crates.io，
# 版本永遠與 workspace 同步，不存在「意外拉到不相容版本」的風險。
# 要擋的是**外部**相依寫成 "*"，那個依然會被擋下。
allow-wildcard-paths = true

# 明確封鎖：AGPL 依賴會強制整個 App 開源並提供原始碼給終端使用者。
# zhconv 預設會綁 MediaWiki 的 GPL-2.0 轉換表。本專案以
# default-features = false + features = ["opencc"] 改用 Apache-2.0 的 OpenCC 詞典。
# 白名單不含 GPL，因此若有人誤開預設 feature，這裡會擋下來。
# 說明見 crates/padnote-text/src/lib.rs。

[[bans.deny]]
name = "mupdf"
reason = "AGPL-3.0 會污染整個 App。PDF 一律使用 PDFium (BSD-3)，見 docs/architecture.md §2.4"

[[bans.deny]]
name = "mupdf-sys"
reason = "同上"

[advisories]
version = 2
# 上游 `zip` crate 作者將 9.0 以前的所有舊版（含 8.x）一次性撤回（yanked），
# 但相依生態系（calamine 0.36 與 docx-rs 0.4 都依賴 zip ^8.6）尚未釋出適配 zip 9.x
# 的新版本，暫時降為 warn。這個專案自己直接用的 zip 已經是 9.x。
yanked = "warn"
# 每一筆豁免都必須寫明「為什麼這個專案不受影響」，而不只是「先讓 CI 過」。
# 上游一有修好的版本就該回來拿掉對應條目。
ignore = [
    # paste：proc-macro，只在編譯期執行，不會進到 App 裡。
    # 來源是 wgpu 0.19 → wgpu-hal → metal，要換掉得整包升 wgpu。
    # 標記為 unmaintained，並非已知漏洞。
    "RUSTSEC-2024-0436",

    # audiopus_sys：Opus 的 C 綁定，標記為 unmaintained，並非已知漏洞。
    # Opus 本身（BSD-3）仍在維護，缺的是 Rust 綁定層的維護者。
    "RUSTSEC-2026-0150",

    # basic-toml：標記為 unmaintained（倉庫已封存），並非已知漏洞，上游也沒有可升級的版本。
    # 來源是 uniffi 0.29（cli feature）→ uniffi_bindgen → askama → askama_derive。
    # askama_derive 是 proc-macro，basic-toml 只在**編譯期**讀 askama 的設定檔，
    # 不會進到 App 裡；uniffi_bindgen 本身也只用在產生 Swift/Kotlin 綁定的 uniffi-bindgen 工具。
    # 待辦：uniffi 換掉 askama 版本（或 askama 改用 toml）後就回來移除這一條。
    "RUSTSEC-2026-0374",

    # ruzstd 0.8.x 的解壓炸彈（RUSTSEC-2026-0344）：精心製作的 .zst 輸入可以讓解碼器一次配置數 GB 記憶體。
    # 來源是 zhconv 0.4.2（繁簡轉換，padnote-search 與 padnote-text 用它），它把 ruzstd 鎖在 0.8，
    # 修補版 0.9.1 要等 zhconv 放行。這個專案不受影響：zhconv 只用 ruzstd 解開**它自己編進程式裡的
    # 轉換規則表**（`zstd_decompress` 只吃 crate 內建的常數資料），沒有任何一條路徑讓使用者或網路
    # 的資料進到解碼器。也不是記憶體安全問題（公告自己寫明只有 DoS）。
    # 待辦：zhconv 放行 ruzstd >= 0.9.1 後就回來移除這一條。
    "RUSTSEC-2026-0344",

    # zstd 0.13 / zstd-safe 7.3（RUSTSEC-2026-0391、RUSTSEC-2026-0398、RUSTSEC-2026-0403）：
    # 來源為 zhconv 0.4.2 的 [build-dependencies]，僅在編譯期（build.rs）用於壓縮內建 OpenCC 詞庫常數，
    # 執行期完全不連結 zstd/zstd-safe（執行期解壓走純 Rust 的 ruzstd），因此不會處理任何網路或使用者未受信任輸入。
    # 待辦：zhconv 升級 build-dependencies 的 zstd 至 >= 0.14.3 後移除。
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

    # zip < 9 的三筆解壓縮漏洞（SUID/SGID 位元、指到目的地外的符號連結、透過符號連結套用權限）。
    # 這個專案自己的解壓縮（padnote-storage）已經升到 zip 9。剩下的 zip 8.6 來自 calamine 0.36
    # （讀 xlsx）與 docx-rs 0.4（寫 docx），兩者都要求 zip ^8.6、尚無支援 zip 9 的版本。
    # 這個專案不受影響：三筆都只發生在 `ZipArchive::extract()` / `ZipStreamReader::extract()`
    # 把封存檔解到磁碟上時；calamine 只在記憶體裡逐項讀 xlsx 的 XML，docx-rs 只負責寫出 docx，
    # 都不會把任何檔案解到磁碟、不建符號連結、也不套用權限位元。
    # 待辦：calamine / docx-rs 放行 zip >= 9 後就回來移除這三條。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
